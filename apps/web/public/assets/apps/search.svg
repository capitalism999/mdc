<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Fluent-style magnifier, in the same family as the other desktop icons
       (volume + soft gradients, no background tile) -->
  <defs>
    <linearGradient id="handle" x1="150" y1="150" x2="236" y2="236" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6B7686"/>
      <stop offset="0.55" stop-color="#3F4753"/>
      <stop offset="1" stop-color="#262B33"/>
    </linearGradient>
    <linearGradient id="collar" x1="140" y1="140" x2="176" y2="176" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#9AA5B4"/>
      <stop offset="1" stop-color="#5E6877"/>
    </linearGradient>
    <linearGradient id="rim" x1="34" y1="30" x2="178" y2="178" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#52C1FF"/>
      <stop offset="0.5" stop-color="#1F8FE5"/>
      <stop offset="1" stop-color="#0F5FC0"/>
    </linearGradient>
    <radialGradient id="glass" cx="88" cy="84" r="86" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F4FBFF"/>
      <stop offset="0.6" stop-color="#CDEBFC"/>
      <stop offset="1" stop-color="#9FD3F5"/>
    </radialGradient>
  </defs>

  <g transform="translate(128 128) scale(1.22) translate(-133 -133)">
  <!-- handle -->
  <path d="M166 166 L218 218" stroke="url(#handle)" stroke-width="34" stroke-linecap="round" fill="none"/>
  <path d="M168 170 L214 216" stroke="#FFFFFF" stroke-opacity="0.14" stroke-width="6" stroke-linecap="round" fill="none"/>
  <!-- collar between lens and handle -->
  <path d="M148 148 L170 170" stroke="url(#collar)" stroke-width="30" stroke-linecap="round" fill="none"/>

  <!-- lens -->
  <circle cx="104" cy="104" r="62" fill="url(#glass)"/>
  <circle cx="104" cy="104" r="62" fill="none" stroke="url(#rim)" stroke-width="22"/>
  <!-- inner edge shade -->
  <circle cx="104" cy="104" r="51" fill="none" stroke="#0F5FC0" stroke-opacity="0.18" stroke-width="3"/>
  <!-- glare -->
  <path d="M70 92 A38 38 0 0 1 102 64" stroke="#FFFFFF" stroke-width="11" stroke-linecap="round" fill="none" opacity="0.95"/>
  <circle cx="68" cy="110" r="5.5" fill="#FFFFFF" opacity="0.85"/>
  <!-- rim highlight -->
  <path d="M58 70 A62 62 0 0 1 96 43" stroke="#FFFFFF" stroke-opacity="0.45" stroke-width="5" stroke-linecap="round" fill="none"/>
  </g>
</svg>
